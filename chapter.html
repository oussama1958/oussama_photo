<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قراءة الفصل وتعديله</title>
<style>
body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    line-height: 2.1;
    box-sizing: border-box;
    direction: rtl;
}

* {
    box-sizing: border-box;
}

/* شريط علوي */
.top-bar {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    background: red;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.back-btn:hover {
    opacity: 0.8;
}

/* تنسيق الحاوية للعنوان والمحتوى مع أزرار التعديل */
.editable-container {
    position: relative;
    margin-bottom: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 30px;
    line-height: 1.5;
    word-break: break-word;
    display: inline-block;
    width: 100%;
    padding-left: 40px; /* مساحة لزر القلم */
}

/* زر القلم الصغير */
.edit-icon-btn {
    background: transparent;
    border: none;
    color: #ff4757;
    font-size: 20px;
    cursor: pointer;
    position: absolute;
    left: 10px;
    top: 10px;
    transition: 0.2s;
    z-index: 10;
}

.edit-icon-btn:hover {
    transform: scale(1.2);
    color: #ff6b81;
}

#chapterTitleContainer .edit-icon-btn {
    position: relative;
    display: block;
    margin: -10px auto 20px auto;
    left: unset;
    top: unset;
}

#content {
    background: #1b1b1b;
    padding: 22px;
    border-radius: 18px;
    font-size: 21px;
    line-height: 2.3;
    word-break: break-word;
    overflow-wrap: break-word;
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
    white-space: pre-wrap; 
    min-height: 150px;
}

/* عناصر الإدخال أثناء التعديل */
.edit-input, .edit-textarea {
    width: 100%;
    background: #222;
    color: white;
    border: 2px solid #ff4757;
    border-radius: 12px;
    padding: 15px;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    outline: none;
}

.edit-textarea {
    height: 400px;
    resize: vertical;
}

/* أزرار التحكم بالتعديل */
.action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    justify-content: flex-end;
}

.save-btn, .cancel-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    background: #2ed573;
    color: white;
}

.cancel-btn {
    background: #747d8c;
    color: white;
}

.hidden {
    display: none !important;
}

/* شاشات الهاتف */
@media(max-width:768px){
    body { padding: 10px; }
    .back-btn { font-size: 14px; padding: 9px 14px; }
    h1 { font-size: 24px; }
    #content { padding: 18px; font-size: 18px; line-height: 2.2; }
}
</style>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="history.back()">رجوع</button>
</div>

<!-- حاوية العنوان -->
<div class="editable-container" id="chapterTitleContainer">
    <h1 id="chapterTitle">جاري التحميل...</h1>
    <button class="edit-icon-btn hidden" id="editTitleBtn" title="تعديل العنوان">✏️</button>
    
    <div id="titleEditForm" class="hidden">
        <input type="text" id="titleInput" class="edit-input">
        <div class="action-buttons">
            <button class="save-btn" id="saveTitleBtn">حفظ</button>
            <button class="cancel-btn" id="cancelTitleBtn">إلغاء</button>
        </div>
    </div>
</div>

<!-- حاوية محتوى الفصل -->
<div class="editable-container">
    <button class="edit-icon-btn hidden" id="editContentBtn" title="تعديل المحتوى">✏️</button>
    <div id="content"></div>
    
    <div id="contentEditForm" class="hidden">
        <textarea id="contentTextarea" class="edit-textarea"></textarea>
        <div class="action-buttons">
            <button class="save-btn" id="saveContentBtn">حفظ</button>
            <button class="cancel-btn" id="cancelContentBtn">إلغاء</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC20dxXLArorRAndMyIF1iBc6R4OVCYZIo",
  authDomain: "oussa-3e001.firebaseapp.com",
  projectId: "oussa-3e001",
  storageBucket: "oussa-3e001.firebasestorage.app",
  messagingSenderId: "963147796988",
  appId: "1:963147796988:web:d06cc7c211f7d20c27a279"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// متغيرات حفظ البيانات الحالية
let currentTitle = "";
let currentContent = "";

// جلب العناصر من الصفحة
const chapterTitleEl = document.getElementById("chapterTitle");
const contentEl = document.getElementById("content");
const editTitleBtn = document.getElementById("editTitleBtn");
const editContentBtn = document.getElementById("editContentBtn");

const titleEditForm = document.getElementById("titleEditForm");
const titleInput = document.getElementById("titleInput");
const contentEditForm = document.getElementById("contentEditForm");
const contentTextarea = document.getElementById("contentTextarea");

async function loadChapter() {
    if(!id) return;
    try {
        const docRef = doc(db, "chapters", id);
        const docSnap = await getDoc(docRef);

        if(docSnap.exists()){
            const chapter = docSnap.data();
            currentTitle = chapter.title;
            currentContent = chapter.content;

            // عرض البيانات
            chapterTitleEl.innerText = currentTitle;
            contentEl.innerText = currentContent;

            // إظهار أزرار القلم بعد اكتمال التحميل
            editTitleBtn.classList.remove("hidden");
            editContentBtn.classList.remove("hidden");
        } else {
            chapterTitleEl.innerText = "الفصل غير موجود";
        }
    } catch (error) {
        console.error("Error loading chapter:", error);
    }
}

// --- تفعيل تعديل العنوان ---
editTitleBtn.addEventListener("click", () => {
    chapterTitleEl.classList.add("hidden");
    editTitleBtn.classList.add("hidden");
    titleEditForm.classList.remove("hidden");
    titleInput.value = currentTitle;
    titleInput.focus();
});

document.getElementById("cancelTitleBtn").addEventListener("click", () => {
    titleEditForm.classList.add("hidden");
    chapterTitleEl.classList.remove("hidden");
    editTitleBtn.classList.remove("hidden");
});

document.getElementById("saveTitleBtn").addEventListener("click", async () => {
    const newTitle = titleInput.value.trim();
    if(newTitle === "") {
        alert("لا يمكن ترك العنوان فارغاً");
        return;
    }

    try {
        const docRef = doc(db, "chapters", id);
        await updateDoc(docRef, { title: newTitle });
        
        currentTitle = newTitle;
        chapterTitleEl.innerText = currentTitle;
        
        // إعادة واجهة العرض للوضع الطبيعي
        titleEditForm.classList.add("hidden");
        chapterTitleEl.classList.remove("hidden");
        editTitleBtn.classList.remove("hidden");
    } catch (error) {
        alert("حدث خطأ أثناء حفظ العنوان الجديد");
    }
});

// --- تفعيل تعديل محتوى الفصل ---
editContentBtn.addEventListener("click", () => {
    contentEl.classList.add("hidden");
    editContentBtn.classList.add("hidden");
    contentEditForm.classList.remove("hidden");
    contentTextarea.value = currentContent;
    contentTextarea.focus();
});

document.getElementById("cancelContentBtn").addEventListener("click", () => {
    contentEditForm.classList.add("hidden");
    contentEl.classList.remove("hidden");
    editContentBtn.classList.remove("hidden");
});

document.getElementById("saveContentBtn").addEventListener("click", async () => {
    const newContent = contentTextarea.value;
    if(newContent.trim() === "") {
        alert("لا يمكن ترك المحتوى فارغاً");
        return;
    }

    try {
        const docRef = doc(db, "chapters", id);
        await updateDoc(docRef, { content: newContent });
        
        currentContent = newContent;
        contentEl.innerText = currentContent;
        
        // إعادة واجهة العرض للوضع الطبيعي
        contentEditForm.classList.add("hidden");
        contentEl.classList.remove("hidden");
        editContentBtn.classList.remove("hidden");
    } catch (error) {
        alert("حدث خطأ أثناء حفظ المحتوى الجديد");
    }
});

// تشغيل جلب البيانات عند فتح الصفحة
loadChapter();
</script>

</body>
</html>
