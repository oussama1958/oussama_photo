<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحديد صلاحيات رصيل</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
    direction: rtl;
}

h1 {
    text-align: center;
    color: #ff9f43;
    margin-bottom: 30px;
}

.box {
    max-width: 600px;
    margin: auto;
    background: #1b1b1b;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.novel-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #252525;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    border: 1px solid #333;
}

.novel-title {
    font-size: 18px;
    font-weight: bold;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.btn-grant { background: #2ed573; color: white; }
.btn-revoke { background: #ff4757; color: white; }
button:hover { opacity: 0.8; }

.loading { text-align: center; color: #888; }
</style>
</head>
<body>

<div class="box">
    <h1>تحديد الروايات المصرح بها لـ رصيل</h1>
    <div id="novelsList" class="loading">جاري تحميل الروايات وحالة الصلاحيات...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
    getFirestore, collection, doc, getDocs, updateDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC20dxXLArorRAndMyIF1iBc6R4OVCYZIo",
  authDomain: "oussa-3e001.firebaseapp.com",
  projectId: "oussa-3e001",
  storageBucket: "oussa-3e001.firebasestorage.app",
  messagingSenderId: "963147796988",
  appId: "1:963147796988:web:d06cc7c211f7d20c27a279"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const novelsList = document.getElementById("novelsList");

async function initPermissions() {
    novelsList.innerHTML = "";
    
    // جلب كل الروايات من قاعدة البيانات
    const novelsSnapshot = await getDocs(collection(db, "novels"));

    if(novelsSnapshot.empty) {
        novelsList.innerHTML = "<p class='loading'>لا توجد روايات مضافة في الموقع حالياً.</p>";
        return;
    }

    novelsSnapshot.forEach((novelDoc) => {
        const id = novelDoc.id;
        const novel = novelDoc.data();
        
        // التحقق من حالة الصلاحية المخزنة داخل المستند نفسه
        const isAllowed = novel.rasilAllowed === true;

        const item = document.createElement("div");
        item.className = "novel-item";
        item.innerHTML = `
            <div class="novel-title">${novel.title}</div>
            <button class="${isAllowed ? 'btn-revoke' : 'btn-grant'}" data-id="${id}" data-status="${isAllowed}">
                ${isAllowed ? 'إلغاء الصلاحية ❌' : 'منح الصلاحية  ✅'}
            </button>
        `;
        novelsList.appendChild(item);
    });

    // ربط الأزرار لتحديث الصلاحية داخل مستند الرواية مباشرة
    novelsList.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", async (e) => {
            const novelId = e.target.getAttribute("data-id");
            const currentStatus = e.target.getAttribute("data-status") === "true";

            // تحديث الحقل rasilAllowed داخل الرواية
            await updateDoc(doc(db, "novels", novelId), {
                rasilAllowed: !currentStatus
            });

            if (currentStatus) {
                alert("تم إلغاء صلاحية الكتابة لهذه الرواية");
            } else {
                alert("تم منح رصيل صلاحية الكتابة في هذه الرواية بنجاح!");
            }
            
            // إعادة تحديث القائمة لرؤية التغيير فوراً
            initPermissions();
        });
    });
}

initPermissions();
</script>

</body>
</html>
