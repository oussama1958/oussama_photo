<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة كتابة الفصول - راسيل</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
    direction: rtl;
}

/* شريط علوي لزر الرجوع */
.top-nav {
    max-width: 700px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: flex-start;
}

/* تنسيق زر الرجوع */
.back-btn {
    background: #333;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    transition: 0.3s;
    border: 1px solid #444;
}

.back-btn:hover {
    background: #444;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #e0e0e0;
}

.box {
    max-width: 700px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
    background: #1b1b1b;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

h2 {
    text-align: center;
    color: #ff4757;
    margin-top: 0;
}

input, textarea, select {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    outline: none;
    font-family: inherit;
}

textarea {
    height: 380px;
    resize: vertical;
    white-space: pre-wrap;
    line-height: 1.6;
}

button {
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #ff4757;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
}

button:hover {
    background: #ff6b81;
}

.note {
    font-size: 13px;
    color: #888;
    text-align: center;
}
</style>
</head>
<body>

<!-- شريط الرجوع العلوي -->
<div class="top-nav">
    <a href="index.html" class="back-btn">⬅️ رجوع للرئيسية</a>
</div>

<h1>لوحة إدارة المحتوى (رصيل)</h1>

<div class="box">
    <h2>إضافة فصل جديد</h2>

    <label for="novelSelect">اختر الرواية المستهدفة:</label>
    <select id="novelSelect">
        <option value="">جاري تحميل الروايات المتاحة لك...</option>
    </select>

    <label for="chapterTitle">عنوان الفصل:</label>
    <input type="text" id="chapterTitle" placeholder="مثال: الفصل الأول: البداية">

    <label for="chapterContent">محتوى الفصل:</label>
    <textarea id="chapterContent" placeholder="اكتب محتوى الفصل هنا... (يدعم الفراغات والأسطر الجديدة تلقائياً)"></textarea>

    <button id="addChapter">نشر الفصل الآن</button>
    
    <p class="note">ملاحظة: تظهر لك فقط الروايات المصرح لك بالكتابة فيها من قبل الإدارة.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
    getFirestore, collection, addDoc, getDocs, query, where 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC20dxXLArorRAndMyIF1iBc6R4OVCYZIo",
  authDomain: "oussa-3e001.firebaseapp.com",
  projectId: "oussa-3e001",
  storageBucket: "oussa-3e001.firebasestorage.app",
  messagingSenderId: "963147796988",
  appId: "1:963147796988:web:d06cc7c211f7d20c27a279"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const novelSelect = document.getElementById("novelSelect");

// جلب الروايات التي تحتوي على صلاحية رصيل فقط بشكل مباشر وضامن
async function loadAllowedNovelsDirectly() {
    novelSelect.innerHTML = '<option value="">-- اختر الرواية --</option>';
    
    // استعلام ذكي يجلب فقط الروايات المصرح لها
    const q = query(collection(db, "novels"), where("rasilAllowed", "==", true));
    const querySnapshot = await getDocs(q);
    
    let hasNovels = false;

    querySnapshot.forEach((doc) => {
        const novel = doc.data();
        novelSelect.innerHTML += `
            <option value="${doc.id}">${novel.title}</option>
        `;
        hasNovels = true;
    });

    if (!hasNovels) {
        novelSelect.innerHTML = '<option value="">لا توجد روايات مصرح بها لك حالياً</option>';
    }
}

loadAllowedNovelsDirectly();

// إضافة الفصل
document.getElementById("addChapter").addEventListener("click", async () => {
    const novelId = novelSelect.value;
    const chapterTitle = document.getElementById("chapterTitle").value.trim();
    const chapterContent = document.getElementById("chapterContent").value;

    if (novelId === "") {
        alert("يرجى اختيار الرواية أولاً");
        return;
    }

    if (chapterTitle === "" || chapterContent.trim() === "") {
        alert("يرجى ملء عنوان الفصل ومحتواه");
        return;
    }

    try {
        await addDoc(collection(db, "chapters"), {
            novelId: novelId,
            title: chapterTitle,
            content: chapterContent
        });

        alert("تمت إضافة الفصل بنجاح بنسق الفراغات الصحيح!");
        document.getElementById("chapterTitle").value = "";
        document.getElementById("chapterContent").value = "";
    } catch (error) {
        console.error("Error adding chapter: ", error);
        alert("حدث خطأ أثناء إضافة الفصل");
    }
});
</script>

</body>
</html>
