<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موقع الروايات</title>

<style>

body{
margin:0;
padding:20px;
background:#0f0f0f;
font-family:Arial;
color:white;
}

h1{
text-align:center;
margin-bottom:30px;
}

#novels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:20px;
}

.card{
background:#1c1c1c;
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h2{
text-align:center;
padding:10px;
font-size:18px;
}

</style>

</head>

<body>

<h1>موقع الروايات</h1>

<div id="novels"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC20dxXLArorRAndMyIF1iBc6R4OVCYZIo",
  authDomain: "oussa-3e001.firebaseapp.com",
  projectId: "oussa-3e001",
  storageBucket: "oussa-3e001.firebasestorage.app",
  messagingSenderId: "963147796988",
  appId: "1:963147796988:web:d06cc7c211f7d20c27a279"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const novelsDiv =
document.getElementById("novels");

async function loadNovels(){

const querySnapshot =
await getDocs(collection(db,"novels"));

querySnapshot.forEach((doc)=>{

const novel = doc.data();

novelsDiv.innerHTML += `

<div class="card"
onclick="location.href='novel.html?id=${doc.id}'">

<img src="${novel.cover}">

<h2>${novel.title}</h2>

</div>

`;

});

}

loadNovels();

</script>

</body>
</html>
